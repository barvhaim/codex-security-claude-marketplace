name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"

      - name: Run repository tests
        run: python3 -m unittest discover -s tests -v

      - name: Check Claude portability
        run: python3 scripts/check_portability.py

      - name: Exercise deterministic finalizer
        run: python3 scripts/smoke_finalize.py

      - name: Compile Python helpers
        run: python3 -m compileall -q plugins/codex-security-skills/scripts scripts tests

      - name: Validate Claude marketplace
        run: npx --yes @anthropic-ai/claude-code@2.1.220 plugin validate .

      - name: Validate Claude plugin
        run: npx --yes @anthropic-ai/claude-code@2.1.220 plugin validate ./plugins/codex-security-skills

      - name: Exercise Claude Code plugin loader
        run: python3 scripts/smoke_plugin_load.py
